<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Calculator</title>
</head>
<body>
    <div class="emi calculator">
        <h2>EMI Calculator</h2>
        <div class ="input group">
            <label for="loan-amount"> Loan amount </label>
            <input type="range" id="loan-amount" min="50000" max="500000" value="100000" step="50000">
            <span id="loan-amount-display">₹ 100000</span>
        </div>
       
        <div class ="input group">
            <label for="rate"> Rate of interest(p.a.) </label>
            <input type="range" id="loan-rate" min="5" max="20" value="6.5" step="0.5">
            <span id="loan-rate-display">6.5%</span>
        </div>

        <div class ="input group">
            <label for="loan-tenure"> Loan tenure </label>
            <input type="range" id="loan-tenure" min="1" max="20" value="5" step="1">
            <span id="loan-tenure-display">5 Yr</span>
        </div>

        
        <div class="result">
            <h3>Monthly EMI: <span id="emi-result">20000</span></h3>
        </div>
            
    </div>
</body>
    <script src="script.js"></script>
</html>
